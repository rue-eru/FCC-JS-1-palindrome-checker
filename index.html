<html lang="en">
    <head>
    <meta charset="utf-8"/>
    <title>a Palindrome Checker</title>
    <link rel="stylesheet" href="styles.css">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body>
            <h1>Is it a Palindrome?</h1>
            <div class="check">
                <p>To check enter your text here:</p>
                <input id="text-input" type="text" placeholder="Palindrome?"/>
                <button id="check-btn">Check</button>
                <p id="result"></p>
            </div>
            <div class="explanation">
                <p>A palindrome is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.</p>
            </div>
        <script src="script.js"></script>
    </body>
</html>
